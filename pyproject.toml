[project]
name = "f1-strategy-board"
version = "1.0.0"
description = "EDA platform mapping off-track operations to on-track Formula 1 performance"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
